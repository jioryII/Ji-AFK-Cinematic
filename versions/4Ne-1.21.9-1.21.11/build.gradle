plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = project.mod_version
group = 'com.ji'
base.archivesName = "ji-afk-cinematic-neoforge-${project.minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

repositories { mavenCentral() }

// Organizational ranges never select a neighboring version's sources silently.
def exactMinecraft = project.minecraft_version
if (!(exactMinecraft in ['1.21.9', '1.21.10', '1.21.11'])) {
    throw new GradleException("No developing exact Mojmap profile for ${exactMinecraft} in 4Ne yet.")
}
def registry = new groovy.json.JsonSlurper().parse(file('../../build-targets.json'))
def exactNeoForge = registry.profiles[exactMinecraft].neoforge.version
if (gradle.startParameter.projectProperties.containsKey('neo_version')
        && project.neo_version != exactNeoForge) {
    throw new GradleException('Use the pinned NeoForge dependency for this exact Minecraft profile.')
}
def experimentalLegacy = exactMinecraft in ['1.21.9', '1.21.10']
def sourceProfile = experimentalLegacy ? 'mojmap-1.21.9-compat' : "mojmap-${exactMinecraft}"
sourceSets.main.java.srcDir "../../minecraft-profiles/${sourceProfile}/src/main/java"
sourceSets.main.java.srcDir "../../platforms/neoforge/mojmap-${exactMinecraft}/src/main/java"
sourceSets.main.resources.srcDir "../../minecraft-profiles/${sourceProfile}/src/main/resources"
sourceSets.test.java.srcDir "../../minecraft-profiles/${sourceProfile}/src/test/java"

if (experimentalLegacy) {
    sourceSets.main.java.srcDir '../../minecraft-profiles/mojmap-1.21.9-focus-compat/src/main/java'
    sourceSets.main.resources.srcDir '../../minecraft-profiles/mojmap-1.21.9-focus-compat/src/main/resources'
}
if (exactMinecraft == '1.21.11') {
    sourceSets.main.java.srcDir '../../minecraft-profiles/mojmap-1.21.11-focus/src/main/java'
    sourceSets.main.resources.srcDir '../../minecraft-profiles/mojmap-1.21.11-focus/src/main/resources'

}


neoForge {
    version = exactNeoForge
    // Pure JUnit tests reference Vec3 and key constants from the real game classpath.
    addModdingDependenciesTo sourceSets.test
    runs { client { client() } }
    mods { 'ji_afk_cinematic' { sourceSet(sourceSets.main) } }
}

if (gradle.startParameter.offline || providers.gradleProperty('qaUseCachedLauncherManifest').isPresent()) {
    def cachedManifest = new File(gradle.gradleUserHomeDir,
            'caches/neoformruntime/artifacts/minecraft_launcher_manifest.json')
    if (cachedManifest.isFile()) neoFormRuntime.launcherManifestUrl = cachedManifest.toURI().toString()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
tasks.named('test') { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
tasks.named('processResources') {
    inputs.properties(mod_version: project.mod_version, minecraft_version: project.minecraft_version,
            neo_version: exactNeoForge)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand mod_version: project.mod_version, minecraft_version: project.minecraft_version,
                neo_version: exactNeoForge
    }
}
tasks.named('jar') { from('../../LICENSE') }
apply from: file('../../gradle/shared-modules.gradle')

tasks.register('verifyNativeLoaderBoundary') {
    dependsOn 'classes'
    doLast {
        sourceSets.main.allJava.each { source ->
            assert !(source.getText('UTF-8') =~ /\b(net\.fabricmc|org\.sinytra)\./):
                    "Fabric/Connector dependency in native NeoForge source: $source"
        }
        configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def id = artifact.moduleVersion.id
            def nativeMixin = id.group == 'net.fabricmc' && id.name == 'sponge-mixin'
            assert nativeMixin || !(id.group =~ /fabricmc|sinytra/):
                    "Fabric/Connector dependency in native NeoForge runtime: ${artifact.moduleVersion.id}"
        }
    }
}
tasks.named('check') { dependsOn 'verifyNativeLoaderBoundary' }




