import groovy.json.JsonSlurper

plugins { id 'base' }

tasks.register('validateTargets') {
    inputs.file('build-targets.json')
    doLast {
        def registry = new JsonSlurper().parse(file('build-targets.json'))
        assert registry.schema == 1
        assert registry.product == 'Ji AFK Cinematic'
        def ids = registry.targets.collect { it.id }
        assert ids.size() == ids.toSet().size(): 'Duplicate target IDs'
        def pairs = []
        registry.targets.each { target ->
            assert target.loader in ['fabric', 'neoforge']
            assert target.id.contains(target.loader == 'fabric' ? 'Fa-' : 'Ne-')
            assert !target.minecraftVersions.empty
            target.minecraftVersions.each { mc ->
                assert registry.profiles.containsKey(mc): "Missing profile ${mc}"
                assert registry.profiles[mc].java == (mc.startsWith('1.21') ? 21 : 25)
                pairs << "${mc}:${target.loader}".toString()
            }
        }
        assert pairs.size() == pairs.toSet().size(): 'Overlapping target coverage'
        assert pairs.size() == 34: 'The initial release must cover all 34 combinations'
        assert registry.profiles.keySet().every { mc ->
            ['fabric', 'neoforge'].every { pairs.contains("${mc}:${it}".toString()) }
        }
    }
}
tasks.named('check') {
    dependsOn 'validateTargets', ':ji-afk-core:check', ':ji-afk-services:check', ':ji-afk-client:check'
}
tasks.named('assemble') {
    dependsOn ':ji-afk-core:assemble', ':ji-afk-services:assemble', ':ji-afk-client:assemble'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.neoforged.net/releases/' }
}
configurations { groupedToolchain }
dependencies {
    groupedToolchain('org.ow2.asm:asm:9.10.1') { transitive = false }
    groupedToolchain('org.ow2.asm:asm-tree:9.10.1') { transitive = false }
    groupedToolchain('net.fabricmc:sponge-mixin:0.15.4+mixin.0.8.7') { transitive = false }
    groupedToolchain('net.neoforged.fancymodloader:loader:4.0.44') { transitive = false }
    groupedToolchain('net.neoforged:bus:8.0.2') { transitive = false }
}
tasks.register('prepareGroupedToolchain') {
    doLast { configurations.groupedToolchain.resolve() }
}
