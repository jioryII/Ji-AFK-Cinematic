// Exact Minecraft dependencies over shared vanilla sources, with native loader ports.
version = project.mod_version
group = 'com.ji'
def nativeLoader = plugins.hasPlugin('net.neoforged.moddev')
def loaderName = nativeLoader ? 'neoforge' : 'fabric'
def exactMinecraft = project.minecraft_version
def registry = new groovy.json.JsonSlurper().parse(file('../../build-targets.json'))
def groupTarget = registry.targets.find { it.id == project.projectDir.name }
if (groupTarget == null || groupTarget.loader != loaderName
        || !groupTarget.minecraftVersions.contains(exactMinecraft)) {
    throw new GradleException('Select an exact Minecraft member of this loader group.')
}
def manifestFile = file("../../minecraft-profiles/mojmap-${exactMinecraft}/profile.json")
if (!manifestFile.isFile()) throw new GradleException("Prepare the exact ${exactMinecraft} profile first.")
def profile = new groovy.json.JsonSlurper().parse(manifestFile)
if (profile.minecraftVersion != exactMinecraft || profile.java != 25) {
    throw new GradleException('Incorrect exact Minecraft API profile.')
}
def pins = registry.profiles[exactMinecraft][loaderName]
def pinnedProperties = nativeLoader ? [neo_version: pins.version]
        : [loader_version: pins.loader, fabric_version: pins.api]
pinnedProperties.each { name, pinned ->
    if (gradle.startParameter.projectProperties.containsKey(name) && project.property(name) != pinned) {
        throw new GradleException("Use pinned ${name} for ${exactMinecraft}.")
    }
}
base.archivesName = "ji-afk-cinematic-${loaderName}-${exactMinecraft}"
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
java.withSourcesJar()
repositories { mavenCentral(); maven { url = 'https://maven.terraformersmc.com/releases/' } }

def exactSource = file('../../' + profile.sourceRoot)
if (!exactSource.canonicalPath.startsWith(file('../../minecraft-profiles').canonicalPath + File.separator)
        || !new File(exactSource, 'src/main/java').isDirectory()) {
    throw new GradleException('Profile sources must be inside minecraft-profiles.')
}
sourceSets.main.java.srcDir new File(exactSource, 'src/main/java')
sourceSets.main.java.srcDir '../../minecraft-profiles/mojmap-26-common/src/main/java'
sourceSets.main.java.srcDir "../../minecraft-profiles/${profile.screenProfile}/src/main/java"
sourceSets.main.java.srcDir "../../platforms/${loaderName}/mojmap-26/src/main/java"
sourceSets.main.resources.srcDir new File(exactSource, 'src/main/resources')
// Each supported 26.x member selects its native optical-focus adapter.
if (exactMinecraft in ['26.1', '26.1.1', '26.1.2', '26.2', '26.3']) {
    def focusProfile = exactMinecraft == '26.3' ? 'mojmap-26.3-focus' : exactMinecraft == '26.2' ? 'mojmap-26.2-focus' : 'mojmap-26.1-focus'
    sourceSets.main.java.srcDir "../../minecraft-profiles/${focusProfile}/src/main/java"
    sourceSets.main.resources.srcDir "../../minecraft-profiles/${focusProfile}/src/main/resources"
}
sourceSets.test.java.srcDir new File(exactSource, 'src/test/java')
if (!nativeLoader) sourceSets.main.java.srcDir '../../platforms/fabric/mojmap-26-modmenu/src/main/java'

if (nativeLoader) {
    neoForge {
        version = pins.version
        addModdingDependenciesTo sourceSets.test
        runs { client { client() } }
        mods { 'ji_afk_cinematic' { sourceSet(sourceSets.main) } }
    }
    if (gradle.startParameter.offline || providers.gradleProperty('qaUseCachedLauncherManifest').isPresent()) {
        def cachedManifest = new File(gradle.gradleUserHomeDir,
            'caches/neoformruntime/artifacts/minecraft_launcher_manifest.json')
        if (cachedManifest.isFile()) neoFormRuntime.launcherManifestUrl = cachedManifest.toURI().toString()
    }
} else {
    dependencies {
        minecraft "com.mojang:minecraft:${exactMinecraft}"
        implementation "net.fabricmc:fabric-loader:${pins.loader}"
        implementation "net.fabricmc.fabric-api:fabric-api:${pins.api}"
        // This is only the optional integration API; runtime compatibility is separate QA.
        compileOnly 'com.terraformersmc:modmenu:18.0.0-beta.1'
    }
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
tasks.named('test') { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
tasks.named('processResources') {
    inputs.properties(version: project.version, mod_version: project.mod_version,
            minecraft_version: exactMinecraft, loader_pins: pins)
    if (nativeLoader) {
        filesMatching('META-INF/neoforge.mods.toml') {
            expand mod_version: project.mod_version, minecraft_version: exactMinecraft, neo_version: pins.version
        }
    } else {
        filesMatching('fabric.mod.json') {
            expand version: project.version, minecraft_version: exactMinecraft,
                    loader_version: pins.loader, fabric_version: pins.api
        }
    }
    if (exactMinecraft in ['26.1', '26.1.1', '26.1.2', '26.2', '26.3']) {
        doLast {
            if (nativeLoader) {
                def metadata = new File(destinationDir, 'META-INF/neoforge.mods.toml')
                metadata.append('\n[[mixins]]\nconfig="ji-afk-focus.mixins.json"\n', 'UTF-8')
            } else {
                def metadata = new File(destinationDir, 'fabric.mod.json')
                def json = new groovy.json.JsonSlurper().parse(metadata)
                json.mixins = (json.mixins + ['ji-afk-focus.mixins.json']).unique()
                metadata.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)), 'UTF-8')
            }
        }
    }
}
tasks.named('jar') { from('../../LICENSE') }
apply from: file('../../gradle/shared-modules.gradle')

tasks.register(nativeLoader ? 'verifyNativeLoaderBoundary' : 'verifyFabricLoaderBoundary') {
    dependsOn 'classes'
    doLast {
        def forbiddenSource = nativeLoader ? /\b(net\.fabricmc|org\.sinytra)\./
                : /\b(net\.neoforged|net\.minecraftforge|org\.sinytra)\./
        sourceSets.main.allJava.each { source ->
            assert !(source.getText('UTF-8') =~ forbiddenSource): "Loader boundary violation: $source"
        }
        configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def id = artifact.moduleVersion.id
            def nativeMixin = nativeLoader && id.group == 'net.fabricmc' && id.name == 'sponge-mixin'
            def forbiddenArtifact = nativeLoader ? /fabricmc|sinytra/ : /neoforged|minecraftforge|sinytra/
            assert nativeMixin || !(id.group =~ forbiddenArtifact): "Loader dependency violation: $id"
        }
    }
}
tasks.named('check') { dependsOn(nativeLoader ? 'verifyNativeLoaderBoundary' : 'verifyFabricLoaderBoundary') }
