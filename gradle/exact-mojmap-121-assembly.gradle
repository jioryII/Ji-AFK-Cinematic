// 1.21.x API ports are explicit. An organizational range is not a compatibility claim.
version = project.mod_version
group = 'com.ji'
def nativeLoader = plugins.hasPlugin('net.neoforged.moddev')
def loaderName = nativeLoader ? 'neoforge' : 'fabric'
def exactMinecraft = project.minecraft_version
def registry = new groovy.json.JsonSlurper().parse(file('../../build-targets.json'))
def groupTarget = registry.targets.find { it.id == project.projectDir.name }
if (groupTarget == null || groupTarget.loader != loaderName
        || !groupTarget.minecraftVersions.contains(exactMinecraft) || !exactMinecraft.startsWith('1.21')) {
    throw new GradleException('Select an exact 1.21.x Minecraft member of this loader group.')
}
def manifestFile = file("../../minecraft-profiles/mojmap-${exactMinecraft}/profile.json")
if (!manifestFile.isFile()) throw new GradleException("Prepare the exact ${exactMinecraft} profile first.")
def profile = new groovy.json.JsonSlurper().parse(manifestFile)
if (profile.minecraftVersion != exactMinecraft || profile.java != 21) throw new GradleException('Wrong exact profile.')
def pins = registry.profiles[exactMinecraft][loaderName]
// The APIs used on 1.21.1 also exist in FFAPI 0.116.15. A compile pin must not
// exclude that compatible Connector runtime just because Fabric's newer patch is used to build.
def resourceApi = !nativeLoader && exactMinecraft == '1.21.1' ? '0.116.15+1.21.1' : pins.api
def pinnedProperties = nativeLoader ? [neo_version: pins.version] : [loader_version: pins.loader, fabric_version: pins.api]
pinnedProperties.each { name, pin ->
    if (gradle.startParameter.projectProperties.containsKey(name) && project.property(name) != pin) {
        throw new GradleException("Use pinned ${name} for ${exactMinecraft}.")
    }
}
base.archivesName = "ji-afk-cinematic-${loaderName}-${exactMinecraft}"
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()
repositories { mavenCentral(); maven { url = 'https://maven.terraformersmc.com/releases/' } }
// Shared ports are selected explicitly; each exact version still needs runtime validation.
def experimental1212 = exactMinecraft in ['1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8']
def profileRoot = file("../../${experimental1212 ? (exactMinecraft in ['1.21.6', '1.21.7', '1.21.8'] ? 'minecraft-profiles/mojmap-1.21.6-compat' : (exactMinecraft == '1.21.5' ? 'minecraft-profiles/mojmap-1.21.5-compat' : (exactMinecraft == '1.21.4' ? 'minecraft-profiles/mojmap-1.21.4-compat' : 'minecraft-profiles/mojmap-1.21.2-compat'))) : (nativeLoader && exactMinecraft == '1.21' ? 'minecraft-profiles/mojmap-1.21-neo' : (profile.sourceRoot ?: 'minecraft-profiles/mojmap-' + exactMinecraft))}").canonicalFile
def profilesBoundary = file('../../minecraft-profiles').canonicalFile.toPath()
if (!profileRoot.toPath().startsWith(profilesBoundary) || !new File(profileRoot, 'src/main/java').isDirectory()) {
    throw new GradleException('Shared profile sources must exist within minecraft-profiles.')
}
def platformProfile = profile.platformProfile ?: "mojmap-${exactMinecraft}"
if (!(platformProfile ==~ /mojmap-[0-9.]+/)) throw new GradleException('Invalid typed platform profile.')
sourceSets.main.java.srcDir new File(profileRoot, 'src/main/java')
sourceSets.main.java.srcDir "../../platforms/${loaderName}/${platformProfile}/src/main/java"
sourceSets.main.resources.srcDir new File(profileRoot, 'src/main/resources')
if (exactMinecraft in ['1.21', '1.21.1']) {
    sourceSets.main.java.srcDir '../../minecraft-profiles/mojmap-1.21.1-focus/src/main/java'
    sourceSets.main.resources.srcDir '../../minecraft-profiles/mojmap-1.21.1-focus/src/main/resources'
}
if (experimental1212) {
    def focusCandidate = exactMinecraft in ['1.21.6', '1.21.7', '1.21.8'] ? 'mojmap-1.21.6-focus-compat' : (exactMinecraft == '1.21.5' ? 'mojmap-1.21.5-focus-compat' : (exactMinecraft == '1.21.4' ? 'mojmap-1.21.4-focus-compat' : 'mojmap-1.21.2-focus-compat'))
    sourceSets.main.java.srcDir "../../minecraft-profiles/${focusCandidate}/src/main/java"
    sourceSets.main.resources.srcDir "../../minecraft-profiles/${focusCandidate}/src/main/resources"
}
sourceSets.test.java.srcDir new File(profileRoot, 'src/test/java')
if (nativeLoader) {
    neoForge {
        version = pins.version
        addModdingDependenciesTo sourceSets.test
        runs { client { client() } }
        mods { 'ji_afk_cinematic' { sourceSet(sourceSets.main) } }
    }
    if (gradle.startParameter.offline || providers.gradleProperty('qaUseCachedLauncherManifest').isPresent()) {
        def manifest = new File(gradle.gradleUserHomeDir, 'caches/neoformruntime/artifacts/minecraft_launcher_manifest.json')
        if (manifest.isFile()) neoFormRuntime.launcherManifestUrl = manifest.toURI().toString()
    }
} else {
    dependencies {
        minecraft "com.mojang:minecraft:${exactMinecraft}"
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${pins.loader}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${pins.api}"
        // Optional integration API only; its runtime version remains a separate check.
        modCompileOnly "com.terraformersmc:modmenu:${profile.modmenuCompileApi}"
    }
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
tasks.named('test') { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
tasks.named('processResources') {
    inputs.properties(mod_version: project.mod_version, version: project.version, minecraft_version: exactMinecraft, loader_pins: pins, fabric_runtime_minimum: resourceApi ?: '')
    if (nativeLoader) {
        filesMatching('META-INF/neoforge.mods.toml') { expand mod_version: project.mod_version, minecraft_version: exactMinecraft, neo_version: pins.version }
    } else {
        filesMatching('fabric.mod.json') { expand version: project.version, minecraft_version: exactMinecraft, loader_version: pins.loader, fabric_version: resourceApi }
    }
}
tasks.named('jar') { from('../../LICENSE') }
apply from: file('../../gradle/shared-modules.gradle')
tasks.register(nativeLoader ? 'verifyNativeLoaderBoundary' : 'verifyFabricLoaderBoundary') {
    dependsOn 'classes'
    doLast {
        def forbiddenSource = nativeLoader ? /\b(net\.fabricmc|org\.sinytra)\./ : /\b(net\.neoforged|net\.minecraftforge|org\.sinytra)\./
        sourceSets.main.allJava.each { source ->
            assert !(source.getText('UTF-8') =~ forbiddenSource): "Loader boundary violation: $source"
        }
        configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def id = artifact.moduleVersion.id
            def mixinEngine = nativeLoader && id.group == 'net.fabricmc' && id.name == 'sponge-mixin'
            def forbidden = nativeLoader ? /fabricmc|sinytra/ : /neoforged|minecraftforge|sinytra/
            assert mixinEngine || !(id.group =~ forbidden): "Loader dependency violation: $id"
        }
    }
}
tasks.named('check') { dependsOn(nativeLoader ? 'verifyNativeLoaderBoundary' : 'verifyFabricLoaderBoundary') }

